name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18.x'

jobs:
  # Lint and Type Check
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check

  # Build and Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          OPENAI_API_KEY: sk-placeholder-key-for-build-only-not-for-runtime

      - name: Check build artifacts
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build failed - .next directory not found"
            exit 1
          fi
          echo "✅ Build successful"

  # Security Check
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Check for exposed secrets
        run: |
          # Check for potential API key leaks (excluding known safe patterns)
          echo "Checking for exposed API keys..."
          
          # Look for actual OpenAI API key patterns (sk- followed by 20+ alphanumeric chars)
          # but exclude known safe patterns and documentation
          SUSPICIOUS_LINES=$(grep -rE "sk-[a-zA-Z0-9_-]{20,}" --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md" --exclude="package-lock.json" --exclude="env.example" --exclude=".env.local" . | \
            grep -v "sk-placeholder-key-for-build-only-not-for-runtime" | \
            grep -v "sk-your-actual-openai-api-key-here" | \
            grep -v "sk-your-production-api-key-here" | \
            grep -v "sk-your-development-api-key-here" | \
            grep -v "sk-your-actual-api-key-here" | \
            grep -v "sk-your-production-key" | \
            grep -v "/\\^sk-\\[a-zA-Z0-9_\\-\\]\\{20,\\}\\$/" || true)
          
          if [ -n "$SUSPICIOUS_LINES" ]; then
            echo "❌ Potential API key found in code:"
            echo "$SUSPICIOUS_LINES"
            exit 1
          fi
          
          echo "✅ No suspicious API keys found"
          
          # Check for .env files in git
          if git ls-files | grep -E "\.env"; then
            echo "❌ .env files found in git - this is a security risk"
            exit 1
          fi
          
          echo "✅ Security check passed"

  # Deploy to Vercel
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build-and-test, security-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # Deploy Preview
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build-and-test, security-check]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Preview to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  # Notify on Success/Failure
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy, deploy-preview]
    if: always()
    steps:
      - name: Notify Success
        if: needs.deploy.result == 'success' || needs.deploy-preview.result == 'success'
        run: |
          echo "🎉 Deployment successful!"
          echo "Production: ${{ needs.deploy.result }}"
          echo "Preview: ${{ needs.deploy-preview.result }}"

      - name: Notify Failure
        if: needs.deploy.result == 'failure' || needs.deploy-preview.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "Production: ${{ needs.deploy.result }}"
          echo "Preview: ${{ needs.deploy-preview.result }}"
          exit 1
